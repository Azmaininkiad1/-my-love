<!DOCTYPE html>
<html>
<head>
    <title>For You ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            overflow: hidden;
        }

        .box {
            background: rgba(255,255,255,0.15);
            padding: 40px 25px;
            border-radius: 25px;
            width: 80%;
        }

        h1 {
            font-size: 32px;
        }

        button {
            padding: 14px 28px;
            margin: 15px 8px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        #yes {
            background: white;
        }

        #no {
            background: white;
            position: absolute;
        }

        #message {
            display: none;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <div class="box" id="question">
        <h1>Do You Love Me? ❤️</h1>

        <button id="yes" onclick="yesClicked()">YES ❤️</button>

        <button id="no" onclick="moveNo()">NO 😏</button>
    </div>

    <div id="message">
        <h1>I Knew It! 😍❤️</h1>
        <p>You are very special to me. 💖</p>
    </div>

    <script>
        function moveNo() {
            let no = document.getElementById("no");

            let x = Math.random() * (window.innerWidth - 120);
            let y = Math.random() * (window.innerHeight - 60);

            no.style.left = x + "px";
            no.style.top = y + "px";
        }

        function yesClicked() {
            document.getElementById("question").style.display = "none";
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
